<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pek Code - AI-Powered Code Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            background-color: #1e1e1e;
            color: #d4d4d4;
        }

        .sidebar {
            width: 250px;
            background-color: #252526;
            border-right: 1px solid #3e3e42;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 15px;
            background-color: #2d2d30;
            border-bottom: 1px solid #3e3e42;
            font-weight: bold;
        }

        .file-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .file-item {
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 4px;
            margin-bottom: 5px;
        }

        .file-item:hover {
            background-color: #2a2d2e;
        }

        .file-item.active {
            background-color: #094771;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .toolbar {
            padding: 10px 15px;
            background-color: #2d2d30;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .toolbar button {
            padding: 8px 16px;
            background-color: #0e639c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .toolbar button:hover {
            background-color: #1177bb;
        }

        .toolbar input, .toolbar select {
            padding: 6px 10px;
            background-color: #3c3c3c;
            border: 1px solid #3e3e42;
            color: #d4d4d4;
            border-radius: 4px;
        }

        .editor-container {
            flex: 1;
            display: flex;
        }

        .code-editor {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .editor-header {
            padding: 10px 15px;
            background-color: #2d2d30;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .code-area {
            flex: 1;
            padding: 15px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            background-color: #1e1e1e;
            color: #d4d4d4;
            border: none;
            outline: none;
            resize: none;
            overflow: auto;
        }

        .chat-panel {
            width: 350px;
            background-color: #252526;
            border-left: 1px solid #3e3e42;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 15px;
            background-color: #2d2d30;
            border-bottom: 1px solid #3e3e42;
            font-weight: bold;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 6px;
        }

        .message.user {
            background-color: #094771;
            margin-left: 20px;
        }

        .message.assistant {
            background-color: #2a2d2e;
            margin-right: 20px;
        }

        .message.error {
            background-color: #5a1d1d;
            margin-right: 20px;
        }

        .message-role {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 12px;
            text-transform: uppercase;
        }

        .chat-input-container {
            padding: 15px;
            border-top: 1px solid #3e3e42;
            background-color: #2d2d30;
        }

        .chat-input {
            width: 100%;
            padding: 10px;
            background-color: #3c3c3c;
            border: 1px solid #3e3e42;
            color: #d4d4d4;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 60px;
        }

        .chat-send-btn {
            margin-top: 10px;
            width: 100%;
            padding: 10px;
            background-color: #0e639c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .chat-send-btn:hover {
            background-color: #1177bb;
        }

        .status-bar {
            padding: 5px 15px;
            background-color: #007acc;
            color: white;
            font-size: 12px;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #007acc;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="logo">⚡ Pek Code</div>
        </div>
        <div class="file-list" id="fileList">
            <div class="file-item" onclick="createNewFile()">+ New File</div>
        </div>
    </div>

    <div class="main-content">
        <div class="toolbar">
            <input type="text" id="fileName" placeholder="file.java" style="width: 200px;">
            <select id="language">
                <option value="java">Java</option>
                <option value="javascript">JavaScript</option>
                <option value="python">Python</option>
                <option value="typescript">TypeScript</option>
                <option value="html">HTML</option>
                <option value="css">CSS</option>
            </select>
            <button onclick="saveFile()">💾 Save</button>
            <button onclick="loadFiles()">🔄 Refresh</button>
            <button onclick="requestCompletion()">✨ Complete Code</button>
        </div>

        <div class="editor-container">
            <div class="code-editor">
                <div class="editor-header">
                    <span id="currentFile">Untitled</span>
                    <span id="aiProvider">AI: Anthropic (Claude)</span>
                </div>
                <textarea class="code-area" id="codeArea" placeholder="Start coding..."></textarea>
            </div>

            <div class="chat-panel">
                <div class="chat-header">AI Assistant</div>
                <div class="chat-messages" id="chatMessages">
                    <div class="message assistant">
                        <div class="message-role">Assistant</div>
                        <div>Hello! I'm your AI coding assistant. Select code and ask me questions, or request code completions.</div>
                    </div>
                </div>
                <div class="chat-input-container">
                    <textarea class="chat-input" id="chatInput" placeholder="Ask me anything about your code..."></textarea>
                    <button class="chat-send-btn" onclick="sendChat()">Send</button>
                </div>
            </div>
        </div>

        <div class="status-bar" id="statusBar">Ready | Spring Boot 4.0 + Java 17 | Spring AI</div>
    </div>

    <script>
        let currentFilePath = null;

        async function loadFiles() {
            try {
                const response = await fetch('/api/files');
                const files = await response.json();
                
                const fileList = document.getElementById('fileList');
                fileList.innerHTML = '<div class="file-item" onclick="createNewFile()">+ New File</div>';
                
                files.forEach(file => {
                    const item = document.createElement('div');
                    item.className = 'file-item';
                    item.textContent = file.name;
                    item.onclick = () => openFile(file);
                    fileList.appendChild(item);
                });
                
                updateStatus('Files refreshed');
            } catch (error) {
                updateStatus('Error loading files: ' + error.message);
            }
        }

        function openFile(file) {
            currentFilePath = file.path;
            document.getElementById('fileName').value = file.name;
            document.getElementById('codeArea').value = file.content;
            document.getElementById('currentFile').textContent = file.name;
            document.getElementById('language').value = file.language;
            updateStatus('Opened: ' + file.name);
        }

        function createNewFile() {
            currentFilePath = null;
            document.getElementById('fileName').value = '';
            document.getElementById('codeArea').value = '';
            document.getElementById('currentFile').textContent = 'Untitled';
            updateStatus('New file created');
        }

        async function saveFile() {
            const fileName = document.getElementById('fileName').value;
            const content = document.getElementById('codeArea').value;
            const language = document.getElementById('language').value;

            if (!fileName) {
                updateStatus('Error: Please enter a file name');
                return;
            }

            try {
                const response = await fetch('/api/files', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        path: fileName,
                        name: fileName,
                        content: content,
                        language: language
                    })
                });

                if (response.ok) {
                    currentFilePath = fileName;
                    document.getElementById('currentFile').textContent = fileName;
                    updateStatus('File saved: ' + fileName);
                    loadFiles();
                } else {
                    updateStatus('Error saving file');
                }
            } catch (error) {
                updateStatus('Error: ' + error.message);
            }
        }

        async function sendChat() {
            const message = document.getElementById('chatInput').value;
            if (!message.trim()) return;

            const codeArea = document.getElementById('codeArea');
            const selectedText = codeArea.value.substring(
                codeArea.selectionStart,
                codeArea.selectionEnd
            );
            const language = document.getElementById('language').value;

            addMessage('user', message);
            document.getElementById('chatInput').value = '';
            updateStatus('Asking AI...');

            try {
                const response = await fetch('/api/ai/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: message,
                        codeContext: selectedText || codeArea.value.substring(0, 500),
                        language: language
                    })
                });

                const data = await response.json();
                addMessage(data.role, data.response);
                updateStatus('AI responded');
            } catch (error) {
                addMessage('error', 'Error: ' + error.message);
                updateStatus('Error communicating with AI');
            }
        }

        async function requestCompletion() {
            const codeArea = document.getElementById('codeArea');
            const code = codeArea.value;
            const language = document.getElementById('language').value;

            if (!code.trim()) {
                updateStatus('Error: No code to complete');
                return;
            }

            updateStatus('Requesting code completion...');

            try {
                const response = await fetch('/api/ai/complete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        code: code,
                        language: language,
                        cursorPosition: codeArea.selectionStart
                    })
                });

                const data = await response.json();
                addMessage('assistant', 'Code Suggestion:\n\n' + data.suggestion);
                updateStatus('Code completion received');
            } catch (error) {
                addMessage('error', 'Error: ' + error.message);
                updateStatus('Error getting completion');
            }
        }

        function addMessage(role, text) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ' + role;
            messageDiv.innerHTML = `
                <div class="message-role">${role}</div>
                <div>${text}</div>
            `;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function updateStatus(message) {
            document.getElementById('statusBar').textContent = message;
        }

        // Load files on startup
        loadFiles();

        // Enter to send chat
        document.getElementById('chatInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendChat();
            }
        });
    </script>
</body>
</html>
